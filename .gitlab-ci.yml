# GitLab CI/CD: test -> build -> plan (both clouds) -> manual, approved apply (AWS primary, GCP alternative).
# Required CI/CD variables (masked/protected): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or OIDC role),
# GOOGLE_APPLICATION_CREDENTIALS (file), GCP_PROJECT, OPERATOR_CIDR, TF_STATE backends configured in versions.tf.
stages: [test, build, plan, deploy, verify]

variables:
  RELEASE: "v$CI_PIPELINE_IID"
  DOCKER_TLS_CERTDIR: "/certs"

unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - apt-get update -qq && apt-get install -y -qq libgomp1 >/dev/null
    - pip install -q -e '.[dev]'
    - ruff check backend tests scripts
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports: {junit: report.xml}

integration-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_PASSWORD: ci
    POSTGRES_USER: supplychain
    POSTGRES_DB: supplychain
    TEST_POSTGRES_URL: postgresql://supplychain:ci@postgres:5432/supplychain
    RUN_FASTEMBED: "1"
  script:
    - apt-get update -qq && apt-get install -y -qq libgomp1 >/dev/null
    - pip install -q -e '.[dev]'
    - pytest -q tests/test_rag_mcp_store.py

terraform-validate:
  stage: test
  image: {name: hashicorp/terraform:1.16, entrypoint: [""]}
  script:
    - for c in aws gcp; do (cd infra/$c && terraform fmt -check && terraform init -backend=false -input=false && terraform validate); done

image:
  stage: build
  image: docker:28
  services: [docker:28-dind]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/app:$RELEASE" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE/app:$RELEASE"

plan-aws:
  stage: plan
  image: {name: hashicorp/terraform:1.16, entrypoint: [""]}
  script:
    - cd infra/aws
    - printf 'allowed_cidrs = ["%s"]\nrelease_version = "%s"\n' "$OPERATOR_CIDR" "$RELEASE" > ci.auto.tfvars
    - terraform init -input=false && terraform plan -input=false -out=aws.tfplan
  artifacts: {paths: [infra/aws/aws.tfplan], expire_in: 7 days}

plan-gcp:
  stage: plan
  image: {name: hashicorp/terraform:1.16, entrypoint: [""]}
  rules: [{if: '$GCP_PROJECT'}]
  script:
    - cd infra/gcp
    - printf 'project_id = "%s"\nallowed_cidrs = ["%s"]\nrelease_version = "%s"\n' "$GCP_PROJECT" "$OPERATOR_CIDR" "$RELEASE" > ci.auto.tfvars
    - terraform init -input=false && terraform plan -input=false -out=gcp.tfplan
  artifacts: {paths: [infra/gcp/gcp.tfplan], expire_in: 7 days}

deploy-aws:
  stage: deploy
  when: manual          # cost approval gate: a maintainer must approve the plan and its estimate
  environment: {name: aws-poc}
  image: {name: hashicorp/terraform:1.16, entrypoint: [""]}
  needs: [plan-aws, image]
  script:
    - apk add --no-cache aws-cli docker-cli bash jq curl python3 py3-pip
    - scripts/deploy-aws.sh "$RELEASE"
  artifacts: {when: always, paths: [deploy-evidence/]}

deploy-gcp:
  stage: deploy
  when: manual
  environment: {name: gcp-poc}
  image: google/cloud-sdk:slim
  needs: [plan-gcp, image]
  rules: [{if: '$GCP_PROJECT'}]
  script:
    - scripts/deploy-gcp.sh "$RELEASE"
  artifacts: {when: always, paths: [deploy-evidence/]}
