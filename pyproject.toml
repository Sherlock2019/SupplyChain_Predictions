[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cosmetics-supply-chain-copilot"
version = "1.0.0"
description = "Governed SAP-first supply-chain AI copilot: FastAPI, LangGraph, Deep Agents, MCP, Flowise, Qwen, RAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.12,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "ortools>=9.11,<10",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "fastembed>=0.5,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "langchain-mcp-adapters>=0.1,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "langgraph-sdk>=0.1,<1",
  "langgraph-cli[inmem]>=0.4,<1",
  "deepagents>=0.5.4,<1",
  "mcp>=1.9,<2",
  "langfuse>=3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
